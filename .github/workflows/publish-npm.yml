name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包校验，不真正发布'
        type: boolean
        default: true

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing：GitHub OIDC 换取一次性发布凭据，无需长期 token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing 要求 npm >= 11.5.1（setup-node 自带的是 10.x）
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node -e 'const {execSync}=require("node:child_process");const v=execSync("npm --version",{encoding:"utf8"}).trim();const [a,b]=v.split(".").map(Number);console.log(`npm ${v}`);if(a<11||(a===11&&b<5)){console.error("npm 版本低于 11.5.1，Trusted Publishing 不可用");process.exit(1);}'

      - name: Verify tag, VERSION and package.json agree
        run: |
          node -e '
            const fs = require("node:fs");
            const version = fs.readFileSync("VERSION", "utf8").trim();
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.version !== version) { console.error(`package.json ${pkg.version} != VERSION ${version}`); process.exit(1); }
            const ref = process.env.GITHUB_REF_NAME || "";
            if (ref.startsWith("v") && ref.slice(1) !== version) {
              console.error(`tag ${ref} != VERSION ${version}`); process.exit(1);
            }
            const url = (pkg.repository && pkg.repository.url) || "";
            const expected = `${process.env.GITHUB_SERVER_URL || "https://github.com"}/${process.env.GITHUB_REPOSITORY}`;
            if (!url.includes(process.env.GITHUB_REPOSITORY || "NO_REPO")) {
              console.error(`package.json repository.url (${url}) 与 ${expected} 不匹配；Trusted Publishing 校验会失败`);
              process.exit(1);
            }
            console.log(`version ${version} ok`);
          '

      - name: Repository checks
        run: node scripts/check-repo.mjs

      - name: Guard tests
        run: node --test tests/rmdl-guard.test.mjs

      - name: Bootstrap (git mode) tests
        run: node --test tests/rmdl-bootstrap.test.mjs

      - name: npm mode tests
        run: node --test tests/rmdl-npm.test.mjs

      - name: Build standard snapshot
        run: node scripts/prepack.mjs

      - name: Pack dry run
        run: npm pack --dry-run

      # 非阻断：仅用于提示是否存在旧 token。当前发布只走 OIDC。
      - name: npm auth preflight
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::检测到 NPM_TOKEN，但本次发布强制使用 OIDC Trusted Publishing"
          else
            echo "未配置 NPM_TOKEN，使用 OIDC Trusted Publishing"
          fi

      - name: Check whether this version is already published
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "rem-ai-design@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::rem-ai-design@$version 已存在于 npm，本次跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish via OIDC
        if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && steps.published.outputs.exists == 'false' }}
        run: |
          # 不注入 NODE_AUTH_TOKEN：认证只能来自 GitHub OIDC
          npm publish --access public
          echo "::notice::published $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
