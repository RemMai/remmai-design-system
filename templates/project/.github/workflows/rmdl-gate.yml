name: RMDL Business Project Policy
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  rmdl-business-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # PRIVATE SUBMODULE REQUIRES EXPLICIT AUTHORIZATION.
          # Default GITHUB_TOKEN may not be authorized to read the RMDL private repo.
      - uses: actions/setup-node@v4
        with:
          # Example only: use the project's reviewed, pinned Node.js LTS version.
          # Prefer node-version-file once .node-version or .nvmrc is committed.
          node-version: '22'
      - name: Validate project selection and static RMDL constraints
        run: node vendor/rmdl/scripts/rmdl.mjs check --root .
      - name: Verify release version metadata from clean source
        run: node vendor/rmdl/scripts/rmdl.mjs version --release --root .
      # In the real build, capture this JSON in the artifact staging directory
      # and feed the SAME metadata into frontend/backend before testing artifacts.
      # The workflow is an INCOMPLETE TEMPLATE: pin the project's npm version,
      # then add npm ci in the package-lock.json workspace, npm run typecheck,
      # npm run lint, npm run test, npm run build and actual visual tests.
      # Do not require this check until private submodule auth + actual project setup work.
